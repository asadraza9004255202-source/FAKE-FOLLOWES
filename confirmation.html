<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmation</title>
<style>
  body {
    background: #050507;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #18181d;
    padding: 40px;
    border-radius: 20px;
    border: 1px solid #ffffff18;
    text-align: center;
    max-width: 400px;
  }
  h1 { color: #267cff; margin-bottom: 10px; }
  p { color: #aaa; font-size: 14px; margin: 10px 0; }
  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    background: linear-gradient(90deg, #ff3158, #7c3cff);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Success! 🎉</h1>
  <p>Thank you, <strong id="userDisplay" style="color:#fff;">-</strong>!</p>
  <p>Your request for <strong id="pkgDisplay" style="color:#ff3158;">-</strong> has been saved successfully.</p>
  <a href="/" class="btn">Go Back Home</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("userDisplay").textContent = params.get("username") || "User";
  document.getElementById("pkgDisplay").textContent = params.get("package") || "Selected Package";
</script>

</body>
</html>
